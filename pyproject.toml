[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ohlcv-guard"
version = "0.1.0"
description = "Dependency-free OHLCV CSV data quality checks"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Franok Research"}]
license = {text = "MIT"}

[project.scripts]
ohlcv-guard = "ohlcv_guard.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
